<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FinTracker AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header and menu are drawn by app.js (renderHeader) -->
        <header id="appHeader" class="header header-compact"></header>

        <!-- Budget alert -->
        <section class="budget-section">
            <div class="section-header">
                <h2>Budget Status</h2>
                <a href="budget.html" class="section-link">Change budget</a>
            </div>
            <div id="budgetAlert" class="budget-alert hidden"></div>
        </section>

        <!-- Budget Forecast -->
        <section class="forecast-section">
            <div class="section-header">
                <h2>Budget Forecast</h2>
                <span id="riskBadge" class="risk-badge hidden">Low Risk</span>
            </div>
            <div id="forecastPanel" class="forecast-panel">
                <p class="insights-empty">Set a budget and add some expenses to see your forecast.</p>
            </div>
        </section>

        <!-- Latest expenses -->
        <section class="expenses-section">
            <div class="section-header">
                <h2>Recent Expenses</h2>
                <a href="history.html" class="section-link">View all</a>
            </div>
            <div id="recentList" class="expenses-list"></div>
        </section>
    </div>

    <!-- Footer credit -->
    <footer class="footer-credit">
        Made by Ekta
    </footer>

    <!-- Loading screen: stays until the login check and the page data are ready -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Loading your data...</p>
    </div>

    <!-- Toast notification container — toasts appear here -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
