<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinTracker AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login and Register. Logged-in users are sent to the dashboard by js/login.js -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h1 class="auth-logo">FinTracker <span class="logo-ai">AI</span></h1>
            <p class="auth-tagline">Your AI-powered personal finance assistant</p>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Your password" required>
                </div>
                <div id="loginError" class="auth-error hidden"></div>
                <button type="submit" class="btn btn-primary btn-full">Login</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label for="registerName">Name</label>
                    <input type="text" id="registerName" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="At least 6 characters" required>
                </div>
                <div id="registerError" class="auth-error hidden"></div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
