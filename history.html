<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - FinTracker AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header and menu are drawn by app.js (renderHeader) -->
        <header id="appHeader" class="header header-compact"></header>

        <section class="expenses-section">
            <div class="section-header">
                <h2>Expense History</h2>
                <button id="clearAllBtn" class="btn btn-secondary">Clear All</button>
            </div>
            <!-- Filter the list by month or by a custom date range -->
            <div class="list-filter">
                <div class="form-group">
                    <label for="filterMonth">Month</label>
                    <select id="filterMonth"></select>
                </div>
                <div class="form-group">
                    <label for="filterFrom">From</label>
                    <input type="date" id="filterFrom">
                </div>
                <div class="form-group">
                    <label for="filterTo">To</label>
                    <input type="date" id="filterTo">
                </div>
                <div class="list-filter-buttons">
                    <button id="applyFilterBtn" class="btn btn-primary btn-sm" type="button">Apply</button>
                    <button id="thisMonthBtn" class="btn btn-sm btn-outline" type="button">This month</button>
                    <button id="showAllBtn" class="btn btn-sm btn-outline" type="button">Show all</button>
                </div>
            </div>
            <p id="listFilterLabel" class="list-filter-label"></p>
            <div id="expensesList" class="expenses-list"></div>
        </section>
    </div>

    <!-- Footer credit -->
    <footer class="footer-credit">
        made with ❤️ by Ekta
    </footer>

    <!-- Loading screen: stays until the login check and the page data are ready -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Loading your data...</p>
    </div>

    <!-- Edit expense window -->
    <div id="editModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>Edit Expense</h2>
            <form id="editForm" class="expense-form">
                <div class="form-group">
                    <label for="editName">Description</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editAmount">Amount</label>
                        <input type="number" id="editAmount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="editDate">Date</label>
                        <input type="date" id="editDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory" required>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Bills & Utilities">Bills & Utilities</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" id="editCancelBtn" class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast notification container — toasts appear here -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
